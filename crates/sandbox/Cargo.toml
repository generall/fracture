[package]
name = "sandbox"
version.workspace = true
edition.workspace = true

[lib]
name = "fracture_client"

[features]
performance-test = ["dep:serde_json", "sim/physics-profile"]
ai-arena = ["dep:serde_json"]

[dependencies]
sim = { path = "../sim" }
macroquad.workspace = true
serde_json = { version = "=1.0.145", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "=0.8.9"
tinyfiledialogs = "=3.9.1"
tank-net = { path = "../net" }
