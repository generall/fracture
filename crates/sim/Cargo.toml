[package]
name = "sim"
version.workspace = true
edition.workspace = true

[features]
physics-profile = []
parallel = ["rapier2d/parallel"]

[[example]]
name = "physics_benchmark"
required-features = ["physics-profile"]

[dependencies]
rapier2d.workspace = true
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
i_overlay = "=4.5.2"

# Serialize presentation vectors without serializing the Rapier physics world.
glam = { version = "=0.33.7", default-features = false, features = ["serde"] }
