<text x="157" y="1016" fill="#f2ecda" font-size="14" font-weight="bold" text-anchor="middle" stroke="#26332d" stroke-width="4" paint-order="stroke">RED BASE</text>
<text x="873" y="171" fill="#f2ecda" font-size="14" font-weight="bold" text-anchor="middle" stroke="#26332d" stroke-width="4" paint-order="stroke">BLUE BASE</text>
<text x="227" y="179" fill="#f2ecda" font-size="14" font-weight="bold" text-anchor="middle" stroke="#26332d" stroke-width="4" paint-order="stroke">VILLAGE</text>
<text x="274" y="317" fill="#f2ecda" font-size="14" font-weight="bold" text-anchor="middle" stroke="#26332d" stroke-width="4" paint-order="stroke">REPAIR YARD</text>
<text x="554" y="630" fill="#f2ecda" font-size="14" font-weight="bold" text-anchor="middle" stroke="#26332d" stroke-width="4" paint-order="stroke">RADAR ISLAND</text>
<text x="558" y="838" fill="#f2ecda" font-size="14" font-weight="bold" text-anchor="middle" stroke="#26332d" stroke-width="4" paint-order="stroke">LOWER RIDGE</text>
<text x="813" y="535" fill="#f2ecda" font-size="14" font-weight="bold" text-anchor="middle" stroke="#26332d" stroke-width="4" paint-order="stroke">UPPER RIDGE</text>
<text x="725" y="903" fill="#f2ecda" font-size="14" font-weight="bold" text-anchor="middle" stroke="#26332d" stroke-width="4" paint-order="stroke">EAST CROSSING</text>
<text x="382" y="375" fill="#f2ecda" font-size="14" font-weight="bold" text-anchor="middle" stroke="#26332d" stroke-width="4" paint-order="stroke">STONE CROSSING</text>
<text x="159" y="220" fill="#f2ecda" font-size="14" font-weight="bold" text-anchor="middle" stroke="#26332d" stroke-width="4" paint-order="stroke">LASER DEPOT</text>
<text x="733" y="751" fill="#f2ecda" font-size="14" font-weight="bold" text-anchor="middle" stroke="#26332d" stroke-width="4" paint-order="stroke">ROCKET</text>
<rect x="999" y="142" width="326" height="910" rx="15" fill="#20302d"/>
<text x="1022" y="186" fill="#c8b179" font-size="22" font-weight="bold">1</text>
<text x="1051" y="184" fill="#f1e6c8" font-size="17" font-weight="bold">VILLAGE ROUTE</text>
<text x="1022" y="218" fill="#d4ded2" font-size="14" font-weight="normal">A settlement with a main street,</text>
<text x="1022" y="241" fill="#d4ded2" font-size="14" font-weight="normal">side lanes, yards and buildings.</text>
<text x="1022" y="264" fill="#d4ded2" font-size="14" font-weight="normal"></text>
<text x="1022" y="287" fill="#d4ded2" font-size="14" font-weight="normal">Use buildings to approach repair.</text>
<text x="1022" y="310" fill="#d4ded2" font-size="14" font-weight="normal">Breach through a house or take</text>
<text x="1022" y="333" fill="#d4ded2" font-size="14" font-weight="normal">an alley to flank the crossing.</text>
<text x="1022" y="397" fill="#c8b179" font-size="22" font-weight="bold">2</text>
<text x="1051" y="395" fill="#f1e6c8" font-size="17" font-weight="bold">CENTRAL ROUTE</text>
<text x="1022" y="429" fill="#d4ded2" font-size="14" font-weight="normal">The most direct line between bases.</text>
<text x="1022" y="452" fill="#d4ded2" font-size="14" font-weight="normal">Two wide bridges reach radar.</text>
<text x="1022" y="475" fill="#d4ded2" font-size="14" font-weight="normal"></text>
<text x="1022" y="498" fill="#d4ded2" font-size="14" font-weight="normal">Rock shoulders give staging cover.</text>
<text x="1022" y="521" fill="#d4ded2" font-size="14" font-weight="normal">Holding the island buys information,</text>
<text x="1022" y="544" fill="#d4ded2" font-size="14" font-weight="normal">but exposes you to both banks.</text>
<text x="1022" y="608" fill="#c8b179" font-size="22" font-weight="bold">3</text>
<text x="1051" y="606" fill="#f1e6c8" font-size="17" font-weight="bold">WILDERNESS ROUTE</text>
<text x="1022" y="640" fill="#d4ded2" font-size="14" font-weight="normal">A wider route around the ridges,</text>
<text x="1022" y="663" fill="#d4ded2" font-size="14" font-weight="normal">with grass and the rocket pickup.</text>
<text x="1022" y="686" fill="#d4ded2" font-size="14" font-weight="normal"></text>
<text x="1022" y="709" fill="#d4ded2" font-size="14" font-weight="normal">Climb for vision or stay low and</text>
<text x="1022" y="732" fill="#d4ded2" font-size="14" font-weight="normal">concealed. The permanent crossing</text>
<text x="1022" y="755" fill="#d4ded2" font-size="14" font-weight="normal">keeps a route after bridge loss.</text>
<path d="M1022 807H1301" stroke="#59705a"/>
<text x="1022" y="839" fill="#aebeb0" font-size="13" font-weight="normal">Connecting tracks allow rotations</text>
<text x="1022" y="861" fill="#aebeb0" font-size="13" font-weight="normal">between routes on either bank.</text>
<text x="1022" y="883" fill="#aebeb0" font-size="13" font-weight="normal"></text>
<text x="1022" y="905" fill="#aebeb0" font-size="13" font-weight="normal">Cover sits at approaches and bends;</text>
<text x="1022" y="927" fill="#aebeb0" font-size="13" font-weight="normal">the open areas are fighting space.</text>
