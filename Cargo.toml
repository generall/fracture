[workspace]
members = ["crates/sim", "crates/sandbox", "crates/game", "crates/net"]
resolver = "3"
exclude = ["vendor/quad-snd"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
rapier2d = { version = "=0.35.3", features = ["enhanced-determinism"] }
macroquad = { version = "=0.4.16", default-features = false, features = ["audio"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1


[patch.crates-io]
quad-snd = { path = "vendor/quad-snd" }
