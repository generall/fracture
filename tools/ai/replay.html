<!doctype html><meta charset="utf-8"><title>Fracture AI match recording</title>
<style>
body{margin:0;background:#10161d;color:#e4eaf0;font:15px system-ui}main{display:grid;grid-template-columns:minmax(400px,1fr) 320px;gap:20px;padding:20px}canvas{width:100%;background:#343a32;border-radius:8px}button,select{font:inherit;padding:6px;background:#263748;color:white;border:1px solid #587087;border-radius:4px}input{width:100%}pre{white-space:pre-wrap;line-height:1.5}.hint{color:#9fb0c2}h1{font-size:21px;margin-top:0}#status{font-variant-numeric:tabular-nums}
</style><main><section><canvas id="map" width="1000" height="1000"></canvas><input id="seek" type="range" min="0" value="0"><button id="play">Play</button> <select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select> <select id="view"><option value="-1">Observer</option><option value="0">Blue visible area</option><option value="1">Red visible area</option></select> <span id="status"></span></section><aside><h1>AI round</h1><div id="names"></div><pre id="info"></pre><p class="hint">Observer geometry is recorded separately from bot observations. Bots receive only their current visible figures, terrain, own state and the public starting map layout. Blue/red tints show each team’s combined current vision. Seek to a stuck location listed below to inspect it.</p><pre id="result"></pre></aside></main>
<script type="module">
const packed=/*MATCH_GZIP*/'';
const bytes=Uint8Array.from(atob(packed),c=>c.charCodeAt(0));
const data=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).json();
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),seek=document.querySelector('#seek');
const frames=data.frames,states=[],bodies=new Map();
for(const f of frames){if(f.tick===0||f.leg!==frames[Math.max(0,states.length-1)].leg)bodies.clear();for(const id of f.removed)bodies.delete(id);for(const b of f.changes)bodies.set(b[0],b);states.push([...bodies.values()]);}
seek.max=frames.length-1;let index=0,playing=false,last=0,elapsed=0;
document.querySelector('#names').textContent=data.summary.versions.map((v,i)=>(i?'Red: ':'Blue: ')+v.name).join(' / ');
document.querySelector('#result').textContent='Winner: '+(data.summary.winner===null?'tie':data.summary.winner===0?'Blue':'Red')+'\n'+data.summary.sides.map((s,i)=>(i?'Red':'Blue')+': '+s.captures+' captures, '+s.kills+' kills\n'+s.stuck_seconds.toFixed(1)+'s stalled (includes clearing)\nStuck samples:\n'+s.stuck_locations.filter((_,i)=>i%5===0).map(p=>p[0].toFixed(1)+'s @ '+p.slice(1).map(v=>v.toFixed(1)).join(', ')).join('\n')).join('\n\n');
function polygon(points){ctx.beginPath();for(let i=0;i<points.length;i++)ctx[i?'lineTo':'moveTo'](...points[i]);ctx.closePath();}
function draw(){const f=frames[index],view=+document.querySelector('#view').value;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#20272b';ctx.fillRect(0,0,1000,1000);const sx=1000/data.map.size[0],sy=1000/data.map.size[1];ctx.setTransform(sx,0,0,-sy,500,500);ctx.lineWidth=.12;
ctx.fillStyle='#5e6550';ctx.fillRect(-data.map.size[0]/2,-data.map.size[1]/2,...data.map.size);
ctx.save();if(view>=0){ctx.beginPath();for(const r of f.views[view].regions){if(!r.boundary.length)continue;ctx.moveTo(...r.boundary[0]);for(const p of r.boundary.slice(1))ctx.lineTo(...p);ctx.closePath();}ctx.clip();}
const terrainColors={Water:'#326687',Cliff:'#4b4843',Road:'#9b8e74',Sand:'#bdad79',TallGrass:'#42683e',Elevation:'#81835c',Bridge:'#997e59'};for(const p of data.terrain){ctx.fillStyle=terrainColors[p.kind]||'#5e6550';ctx.fillRect(...p.min,p.max[0]-p.min[0],p.max[1]-p.min[1]);}
for(const b of states[index]){const g=data.geometry[b[1]];if(g.material==='Launcher'||b[5]<=0)continue;ctx.save();ctx.translate(b[2],b[3]);ctx.rotate(b[4]);ctx.globalAlpha=b[5];ctx.fillStyle=g.color?'rgb('+g.color.join(',')+')':({Masonry:'#b39a83',Panel:'#b8a36f',Rock:'#8b9290',Anchor:'#676d70',Boundary:'#20272b'}[g.material]||'#999');const s=g.shape;if(s.Box){ctx.fillRect(-s.Box.half[0],-s.Box.half[1],s.Box.half[0]*2,s.Box.half[1]*2);}else if(s.Triangle){polygon(s.Triangle.vertices);ctx.fill();}else if(s.Ball){ctx.beginPath();ctx.arc(0,0,s.Ball.radius,0,Math.PI*2);ctx.fill();}ctx.restore();}
ctx.fillStyle='#ffe39e';for(const p of f.shells){ctx.beginPath();ctx.arc(...p,.25,0,Math.PI*2);ctx.fill();}ctx.restore();
if(view<0){for(let team=0;team<2;team++){ctx.fillStyle=team?'rgba(255,45,80,.22)':'rgba(20,140,255,.22)';ctx.beginPath();for(const r of f.views[team].regions){if(!r.boundary.length)continue;ctx.moveTo(...r.boundary[0]);for(const p of r.boundary.slice(1))ctx.lineTo(...p);ctx.closePath();}ctx.fill();}}
for(const [team,p]of data.map.flags){ctx.fillStyle=team==='blue'?'#4bafff':'#ff6767';ctx.beginPath();ctx.arc(...p,1.2,0,Math.PI*2);ctx.fill();}
for(const t of f.actors||[]){if(!t.mounted||t.health<=0)continue;if(view>=0&&t.team!==(view?'red':'blue')&&!f.views[view].targets.some(p=>Math.hypot(p.position[0]-t.position[0],p.position[1]-t.position[1])<.1))continue;ctx.save();ctx.translate(...t.position);ctx.rotate(t.turret);ctx.fillStyle=t.team==='blue'?'#5db5ff':'#ff6262';ctx.fillRect(-.8,-.8,1.6,1.6);ctx.fillStyle='#eee';ctx.fillRect(0,-.15,2,.3);ctx.restore();}
for(let side=0;side<f.views.length;side++){const v=f.views[side];if(view>=0&&side%2!==view&&!f.views[view].targets.some(t=>Math.hypot(t.position[0]-v.position[0],t.position[1]-v.position[1])<.1))continue;ctx.save();ctx.translate(...v.position);ctx.rotate(v.hull);ctx.fillStyle=side%2?'#ff6262':'#5db5ff';ctx.globalAlpha=v.alive?1:.3;ctx.fillRect(-1.1,-.82,2.2,1.64);ctx.rotate(v.turret-v.hull);ctx.fillStyle='#e5e8eb';ctx.fillRect(0,-.15,1.8,.3);ctx.restore();if(view<0||side%2===view){ctx.strokeStyle=side%2?'#ff8888':'#88ccff';ctx.beginPath();ctx.moveTo(...v.position);ctx.lineTo(...v.telemetry.waypoint);ctx.stroke();}}
document.querySelector('#status').textContent=(f.tick/120).toFixed(1)+' / '+data.summary.seconds.toFixed(1)+' s';document.querySelector('#info').textContent=f.views.map((v,i)=>(i%2?'Red':'Blue')+' '+(Math.floor(i/2)+1)+' '+v.telemetry.mode+'\nVehicle '+(v.vehicle||'tank').toUpperCase()+'\nHealth '+v.health.toFixed(0)+' / route '+v.telemetry.route_cells+' cells\nRecoveries '+v.telemetry.recoveries+' / replans '+v.telemetry.replans).join('\n\n');seek.value=index;}
seek.oninput=()=>{index=+seek.value;draw()};document.querySelector('#view').onchange=draw;document.querySelector('#play').onclick=()=>{playing=!playing;if(index===frames.length-1)index=0;document.querySelector('#play').textContent=playing?'Pause':'Play'};
function animate(now){if(playing){elapsed+=(now-last)*+document.querySelector('#speed').value;while(elapsed>=100){elapsed-=100;index++;if(index>=frames.length){index=frames.length-1;playing=false;document.querySelector('#play').textContent='Play';break;}}draw();}last=now;requestAnimationFrame(animate)}draw();requestAnimationFrame(animate);
</script>
